# Phase 0 on a GitHub-hosted runner: the runner reaches Hugging Face and can
# hold the model key as a secret, which the authoring session cannot.
# Small results are committed under results/phase0/<run_number>/ so they can
# be read back through the GitHub API; bulky files go to artifacts.
name: phase0
on:
  # Two ways to start a run: the Actions UI (inputs below), or pushing a branch
  # named run/phase0-* that carries a .phase0-run.json with the same keys —
  # the path used when the API caller cannot dispatch workflows.
  push:
    branches: ["run/phase0-*"]
  workflow_dispatch:
    inputs:
      dataset:
        description: "Hugging Face dataset id"
        default: "SWE-bench-Live/SWE-bench-Live"
      split:
        description: "Dataset split (lite | verified | full | all)"
        default: "full"
      cutoff:
        description: "Training cutoff (YYYY-MM-DD) of the model under evaluation. Blank = no freshness gate (exploration only)."
        default: ""
      model:
        description: "Model id for the control arm"
        default: "claude-opus-5"
      provider:
        description: "anthropic | openai-compatible"
        default: "anthropic"
      base_url:
        description: "openai-compatible only: chat-completions base URL, e.g. https://openrouter.ai/api/v1"
        default: ""
      model_extra:
        description: "openai-compatible only: JSON merged into each request (provider pinning)"
        default: ""
      repos:
        description: "restrict the control arm to these repos (comma-separated owner/name); blank = all"
        default: ""
      run_control:
        description: "Run the control arm (spends API credit; needs ANTHROPIC_API_KEY secret)"
        type: boolean
        default: false
      limit:
        description: "Max tasks for the control arm"
        default: "50"
      top_k:
        default: "3"
      per_repo_limit:
        description: "at most N tasks per repo (0 = no cap)"
        default: "0"
      reuse_cache_run:
        description: "reuse the response cache of a previous phase0 run number (offline, no model spend)"
        default: ""
permissions:
  contents: write
  actions: read
concurrency:
  group: phase0-${{ github.ref }}
jobs:
  corpus:
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.dir.outputs.dir }}
      dataset: ${{ steps.cfg.outputs.dataset }}
      split: ${{ steps.cfg.outputs.split }}
      cutoff: ${{ steps.cfg.outputs.cutoff }}
      model: ${{ steps.cfg.outputs.model }}
      provider: ${{ steps.cfg.outputs.provider }}
      base_url: ${{ steps.cfg.outputs.base_url }}
      model_extra: ${{ steps.cfg.outputs.model_extra }}
      run_control: ${{ steps.cfg.outputs.run_control }}
      limit: ${{ steps.cfg.outputs.limit }}
      top_k: ${{ steps.cfg.outputs.top_k }}
      repos: ${{ steps.cfg.outputs.repos }}
      per_repo_limit: ${{ steps.cfg.outputs.per_repo_limit }}
      reuse_cache_run: ${{ steps.cfg.outputs.reuse_cache_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]" "datasets>=3"
      - id: cfg
        name: Resolve run config (dispatch inputs override .phase0-run.json)
        env:
          IN_SPLIT: ${{ steps.cfg.outputs.split }}
          IN_CUTOFF: ${{ steps.cfg.outputs.cutoff }}
          IN_MODEL: ${{ steps.cfg.outputs.model }}
          IN_RUN_CONTROL: ${{ inputs.run_control }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_TOP_K: ${{ inputs.top_k }}
          IN_PER_REPO_LIMIT: ${{ inputs.per_repo_limit }}
          IN_REUSE_CACHE_RUN: ${{ inputs.reuse_cache_run }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          cfg = json.load(open(".phase0-run.json")) if os.path.exists(".phase0-run.json") else {}
          def pick(env, key, default):
              v = os.environ.get(env, "")
              return v if v not in ("", "false") or key == "cutoff" and v != "" else cfg.get(key, default)
          out = {"dataset": pick("IN_DATASET", "dataset", "SWE-bench-Live/SWE-bench-Live"), "split": pick("IN_SPLIT", "split", "full"), "cutoff": pick("IN_CUTOFF", "cutoff", ""),
                 "model": pick("IN_MODEL", "model", "claude-opus-5"), "provider": pick("IN_PROVIDER", "provider", "anthropic"),
                 "base_url": pick("IN_BASE_URL", "base_url", ""), "model_extra": json.dumps(cfg["model_extra"]) if isinstance(cfg.get("model_extra"), dict) else pick("IN_MODEL_EXTRA", "model_extra", ""), "run_control": str(pick("IN_RUN_CONTROL", "run_control", False)).lower(),
                 "limit": str(pick("IN_LIMIT", "limit", 50)), "top_k": str(pick("IN_TOP_K", "top_k", 3)), "per_repo_limit": str(pick("IN_PER_REPO_LIMIT", "per_repo_limit", 0)), "reuse_cache_run": str(pick("IN_REUSE_CACHE_RUN", "reuse_cache_run", "")),
                 "repos": ",".join(cfg["repos"]) if isinstance(cfg.get("repos"), list) else pick("IN_REPOS", "repos", "")}
          for k, v in out.items(): print(f"{k}={v}")
          import sys; print(json.dumps(out), file=sys.stderr)
          PY
      - id: dir
        run: echo "dir=results/phase0/${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Pull corpus (+ freshness gate when a cutoff is given)
        run: |
          set -euo pipefail
          mkdir -p corpus "${{ steps.dir.outputs.dir }}"
          if [ -n "${{ steps.cfg.outputs.cutoff }}" ]; then
            printf '{"%s": "%s"}\n' "${{ steps.cfg.outputs.model }}" "${{ steps.cfg.outputs.cutoff }}" > corpus/models.json
            python -m phase0.corpus pull --dataset "${{ steps.cfg.outputs.dataset }}" --split "${{ steps.cfg.outputs.split }}" --out corpus/tasks.jsonl --models corpus/models.json 2> corpus/pull.log
            cp corpus/models.json "${{ steps.dir.outputs.dir }}/models.json"
            cp corpus/tasks.freshness.jsonl "${{ steps.dir.outputs.dir }}/freshness.jsonl"
          else
            python -m phase0.corpus pull --dataset "${{ steps.cfg.outputs.dataset }}" --split "${{ steps.cfg.outputs.split }}" --out corpus/tasks.jsonl 2> corpus/pull.log
          fi
          cat corpus/pull.log
          cp corpus/pull.log "${{ steps.dir.outputs.dir }}/pull.log"
      - name: Chain report
        run: |
          set -euo pipefail
          D="${{ steps.dir.outputs.dir }}"
          python -m phase0.chains corpus/tasks.jsonl --min-build 20 --min-eval 10 --md "$D/chain-report.md" --json "$D/chains.json" > /dev/null
          python - <<'PY' > "$D/corpus-summary.json"
          import json, collections
          rows=[json.loads(l) for l in open("corpus/tasks.jsonl")]
          by=collections.Counter(r["repo"] for r in rows)
          dates=sorted(r["created_at"][:10] for r in rows)
          months=collections.Counter(d[:7] for d in dates)
          # how much corpus survives each candidate cutoff, and how many repos keep >= 30 tasks
          survivors={}
          for c in ["2024-07-01","2025-01-01","2025-04-01","2025-07-01","2026-01-01"]:
              keep=[r for r in rows if r["created_at"][:10] > c]
              rc=collections.Counter(r["repo"] for r in keep)
              survivors[c]={"tasks":len(keep),"repos":len(rc),"repos_ge30":sum(1 for v in rc.values() if v>=30),"repos_ge20":sum(1 for v in rc.values() if v>=20)}
          langs=collections.Counter(r.get("language","?") for r in rows)
          print(json.dumps({"dataset":"${{ steps.cfg.outputs.dataset }}","split":"${{ steps.cfg.outputs.split }}","cutoff":"${{ steps.cfg.outputs.cutoff }}","n_tasks":len(rows),"n_repos":len(by),"first":dates[0] if dates else None,"last":dates[-1] if dates else None,"per_month":dict(sorted(months.items())),"survivors_after_cutoff":survivors,"languages":dict(langs),"fields":sorted(rows[0].keys()) if rows else []},indent=1))
          PY
          cat "$D/corpus-summary.json"; head -12 "$D/chain-report.md"
      - name: Gold-location recurrence report (Gate 3 precheck, no model)
        if: steps.cfg.outputs.repos != ''
        run: |
          CM=""; [ -f results/phase0/18/control/metrics.json ] && CM="--control-metrics results/phase0/18/control/metrics.json"
          python -m phase2.recurrence corpus/tasks.jsonl --repos "${{ steps.cfg.outputs.repos }}" --prefixes 20,30,40,50,60,80 $CM \
            --md "${{ steps.dir.outputs.dir }}/recurrence.md" --json "${{ steps.dir.outputs.dir }}/recurrence.json" | tail -12
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ github.run_number }}
          path: corpus/
          retention-days: 90
      - name: Commit results
        run: |
          set -euo pipefail
          git config user.name "phase0-bot"; git config user.email "phase0-bot@users.noreply.github.com"
          git add results/
          git commit -m "results(phase0): run ${{ github.run_number }} corpus + chain report [skip ci]" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
  control:
    needs: corpus
    if: needs.corpus.outputs.run_control == 'true'
    runs-on: ubuntu-latest
    # The model key lives in a GitHub *environment* named MODEL_API_KEY (environment secret,
    # no protection rules). Binding the job to it is what makes secrets.MODEL_API_KEY resolve.
    environment: MODEL_API_KEY
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # accept common alternative names so a misnamed secret still works; the diagnostic step prints which names exist
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY || secrets.OPENROUTER_API_KEY || secrets.MODEL_SECRET || secrets.MODEL_KEY || secrets.MODEL_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]" "anthropic>=1"
      - uses: actions/download-artifact@v4
        with:
          name: corpus-${{ github.run_number }}
          path: corpus/
      - name: Reuse a previous run's response cache (offline)
        if: needs.corpus.outputs.reuse_cache_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          N="${{ needs.corpus.outputs.reuse_cache_run }}"
          RID=$(gh api "repos/${{ github.repository }}/actions/workflows/phase0.yml/runs?per_page=100" --jq ".workflow_runs[] | select(.run_number == $N) | .id" | head -1)
          test -n "$RID" || { echo "no workflow run with run_number $N"; exit 3; }
          gh run download "$RID" -n "control-$N" -D prev/
          mkdir -p runs && cp prev/control-a/cache.jsonl runs/reused-cache.jsonl
          echo "REUSED_CACHE=runs/reused-cache.jsonl" >> "$GITHUB_ENV"
          echo "reused $(wc -l < runs/reused-cache.jsonl) cached responses from run $N ($RID)"
      - name: Key present?
        run: |
          if [ -n "$MODEL_API_KEY" ]; then echo "MODEL_API_KEY resolved: yes (${#MODEL_API_KEY} chars)"; else echo "MODEL_API_KEY resolved: NO"; fi
      - name: Record the host's serving endpoints for the model (pre-registration pinning)
        if: needs.corpus.outputs.provider == 'openai-compatible'
        run: |
          set -euo pipefail
          D="${{ needs.corpus.outputs.dir }}/control"; mkdir -p "$D"
          BASE="${{ needs.corpus.outputs.base_url }}"; MODEL="${{ needs.corpus.outputs.model }}"
          curl -sS -H "Authorization: Bearer $MODEL_API_KEY" "$BASE/models/$MODEL/endpoints" -o "$D/endpoints.json" || echo '{"error":"endpoint listing unsupported by host"}' > "$D/endpoints.json"
          python - <<'PY'
          import json; d=json.load(open("${{ needs.corpus.outputs.dir }}/control/endpoints.json"))
          for e in (d.get("data",{}).get("endpoints") or []):
              print(e.get("provider_name"), "| quant", e.get("quantization"), "| ctx", e.get("context_length"), "| $/M", float(e.get("pricing",{}).get("prompt",0))*1e6, float(e.get("pricing",{}).get("completion",0))*1e6, "| params", e.get("supported_parameters"))
          PY
      - name: Control arm, then offline rerun, then compare
        run: |
          set -euo pipefail
          P="--provider ${{ needs.corpus.outputs.provider }}"
          if [ "${{ needs.corpus.outputs.provider }}" = "anthropic" ]; then
            test -n "$ANTHROPIC_API_KEY" || { echo "ANTHROPIC_API_KEY secret is not set"; exit 2; }
          else
            test -n "$MODEL_API_KEY" || { echo "MODEL_API_KEY secret is not set"; exit 2; }
            P="$P --base-url ${{ needs.corpus.outputs.base_url }} --api-key-env MODEL_API_KEY"
            if [ -n '${{ needs.corpus.outputs.model_extra }}' ]; then P="$P --model-extra"; MX='${{ needs.corpus.outputs.model_extra }}'; fi
          fi
          M=""; [ -f corpus/models.json ] && M="--models corpus/models.json"
          R=""; [ -n "${{ needs.corpus.outputs.repos }}" ] && R="--repos ${{ needs.corpus.outputs.repos }}"
          C=""; [ -n "${REUSED_CACHE:-}" ] && C="--cache $REUSED_CACHE --offline"
          python -m phase0.run_control --tasks corpus/tasks.jsonl $M --repos-dir corpus/repos --out runs/control-a $P ${MX:+"$MX"} $R $C --model "${{ needs.corpus.outputs.model }}" --top-k "${{ needs.corpus.outputs.top_k }}" --limit "${{ needs.corpus.outputs.limit }}" --per-repo-limit "${{ needs.corpus.outputs.per_repo_limit }}"
          python -m phase0.run_control --tasks corpus/tasks.jsonl $M --repos-dir corpus/repos --out runs/control-b $P ${MX:+"$MX"} $R --model "${{ needs.corpus.outputs.model }}" --top-k "${{ needs.corpus.outputs.top_k }}" --limit "${{ needs.corpus.outputs.limit }}" --per-repo-limit "${{ needs.corpus.outputs.per_repo_limit }}" --cache "${REUSED_CACHE:-runs/control-a/cache.jsonl}" --offline
          python -m phase0.run_control --compare runs/control-a runs/control-b | tee runs/compare.txt
          # oracle hand-check sample (Gate 2.3): 50 flags, fixed seed, oracle label + gold files, manual column blank
          python -m phase2.handcheck export runs/control-a/flags.jsonl corpus/tasks.jsonl --n 50 --seed 1 --out runs/handcheck.csv
          python -m phase2.handcheck verify runs/handcheck.csv corpus/tasks.jsonl --out runs/handcheck-verified.csv | tee runs/handcheck-verify.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-${{ github.run_number }}
          path: runs/
          retention-days: 90
      - name: Commit results
        if: always()
        run: |
          set -euo pipefail
          D="${{ needs.corpus.outputs.dir }}/control"; mkdir -p "$D"
          for f in metrics.json manifest.json flags.jsonl errors.jsonl freshness.jsonl; do [ -f runs/control-a/$f ] && cp runs/control-a/$f "$D/"; done; true
          [ -f runs/compare.txt ] && cp runs/compare.txt "$D/"
          [ -f runs/handcheck.csv ] && cp runs/handcheck.csv "$D/"
          [ -f runs/handcheck-verified.csv ] && cp runs/handcheck-verified.csv runs/handcheck-verify.txt "$D/"; true
          git config user.name "phase0-bot"; git config user.email "phase0-bot@users.noreply.github.com"
          git add results/
          git commit -m "results(phase0): run ${{ github.run_number }} control arm [skip ci]" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
