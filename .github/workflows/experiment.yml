# Phases 3–4 on a hosted runner. Start by pushing run/exp-<n> carrying .exp-run.json:
# {
#   "corpus_run": 18,                       # phase0 run whose corpus artifact (tasks.jsonl + models.json) to reuse
#   "stage": "both",                        # learn | evaluate | both | analyze | rolling (design A: prequential, no split)
#   "warmup": 20,                           # rolling: tasks per repo learned from but not scored
#   "resume_run": "",                       # rolling: experiment run whose rolling-N artifact (caches) to reuse
#   "calibrate_tau": false,                 # rolling on calibration repos: also run phase2.calibrate_tau on the ungated arm -> tau.json
#   "placebo_pool": "docs/placebo-pool.v2.json",   # rolling: pool file for a placebo arm (phase4.placebo_pool)
#   "pool_from_run": 8,                     # stage placebo-pool: build the pool from that run's rolling-N artifact kernels
#   "merge_runs": [10, 11, 12],             # stage merge: aggregate results/experiment/<n>/rolling of these (sharded) runs
#   "eval_run": "",                         # for stage=analyze: experiment run whose results/experiment/<n>/eval to analyse (must be on the branch)
#   "secondary_repos": [],                  # for the paired analysis: labeled secondary subset (e.g. repos that passed Gate 3)
#   "granularity": "file",                  # v2: "function" = two-stage verifier, symbolised ground truth, function-keyed consolidation
#   "tau": 0.0,                             # v2: retrieval gate for the treatment arm (0 = inject top-k as v1)
#   "arms": ["control", "treatment"],       # v2: add "ungated" for the attribution arm (frozen memory, tau 0)
#   "learn_run": "",                        # for stage=evaluate: experiment run number whose learn artifact to reuse
#   "repos": ["owner/name", ...], "build": 20, "build_rule": "70:50,58:40,41:30,0:20", "min_eval": 10,
#   "min_occurrences": 2, "min_distinct_inputs": 2,
#   "ceiling_metrics": "results/phase0/18/control/metrics.json", "ceiling": 0.90,   # optional ceiling rule (D19)
#   "negative_control": "owner/name",
#   "model": "meta-llama/llama-3.3-70b-instruct", "provider": "openai-compatible", "base_url": "https://openrouter.ai/api/v1",
#   "model_extra": {"provider": {"order": ["Crusoe", "CoreWeave"], "allow_fallbacks": false}},
#   "similarity": "embedding", "embedding_model": "sentence-transformers/all-MiniLM-L6-v2", "embedding_revision": "<sha>",
#   "theta": 0.45, "rho": 0.70, "cluster_similarity": 0.60, "ttl": 30, "top_k": 3, "seed": 7,
#   "max_eval_per_repo": 0                  # >0 only for smoke runs
# }
# Results: results/experiment/<run_number>/ (split.json, per-repo gate3.json, gate4.json, arms.json); kernels + caches as artifacts.
name: experiment
on:
  push:
    branches: ["run/exp-*"]
permissions:
  contents: write
  actions: read
concurrency:
  group: experiment-${{ github.ref }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    environment: MODEL_API_KEY
    env:
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]" "anthropic>=1" "sentence-transformers>=3" "huggingface_hub>=0.25"
      - id: cfg
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c = json.load(open(".exp-run.json"))
          def g(k, d=""): v = c.get(k, d); return json.dumps(v) if isinstance(v, (dict, list)) else str(v)
          for k, d in [("corpus_run", ""), ("stage", "both"), ("learn_run", ""), ("eval_run", ""), ("build", 20), ("min_eval", 10), ("ceiling_metrics", ""), ("ceiling", 0.90),
                       ("negative_control", ""), ("model", "meta-llama/llama-3.3-70b-instruct"), ("provider", "openai-compatible"),
                       ("base_url", "https://openrouter.ai/api/v1"), ("similarity", "embedding"), ("embedding_model", "sentence-transformers/all-MiniLM-L6-v2"),
                       ("embedding_revision", ""), ("theta", 0.45), ("rho", 0.70), ("cluster_similarity", 0.60), ("ttl", 30), ("top_k", 3), ("seed", 7), ("max_eval_per_repo", 0), ("consolidation", "file"), ("build_rule", ""), ("min_occurrences", 2), ("min_distinct_inputs", 2), ("granularity", "file"), ("tau", 0.0), ("warmup", 20), ("resume_run", ""), ("calibrate_tau", "false"), ("placebo_pool", ""), ("pool_from_run", "")]:
              print(f"{k}={g(k, d)}")
          print("repos=" + ",".join(c.get("repos", [])))
          print("secondary_repos=" + ",".join(c.get("secondary_repos", [])))
          print("arms=" + ",".join(c.get("arms", ["control", "treatment"])))
          print("merge_runs=" + ",".join(str(x) for x in c.get("merge_runs", [])))
          print("model_extra=" + json.dumps(c.get("model_extra", {})))
          print("dir=results/experiment/${{ github.run_number }}")
          PY
      - name: Fetch the corpus from the phase0 run
        if: steps.cfg.outputs.stage != 'merge' && steps.cfg.outputs.stage != 'placebo-pool'
        run: |
          set -euo pipefail
          N="${{ steps.cfg.outputs.corpus_run }}"; test -n "$N" || { echo "corpus_run is required"; exit 3; }
          RID=$(gh api "repos/${{ github.repository }}/actions/workflows/phase0.yml/runs?per_page=100" --jq ".workflow_runs[] | select(.run_number == $N) | .id" | head -1)
          test -n "$RID" || { echo "no phase0 run $N"; exit 3; }
          gh run download "$RID" -n "corpus-$N" -D corpus/
          ls corpus/ && wc -l corpus/tasks.jsonl
      - name: Split (pre-registration values; ceiling rule optional)
        if: steps.cfg.outputs.stage != 'analyze' && steps.cfg.outputs.stage != 'rolling' && steps.cfg.outputs.stage != 'merge' && steps.cfg.outputs.stage != 'placebo-pool'
        run: |
          set -euo pipefail
          D="${{ steps.cfg.outputs.dir }}"; mkdir -p "$D"
          CM=""; [ -n "${{ steps.cfg.outputs.ceiling_metrics }}" ] && CM="--ceiling-metrics ${{ steps.cfg.outputs.ceiling_metrics }} --ceiling ${{ steps.cfg.outputs.ceiling }}"
          BR=""; [ -n "${{ steps.cfg.outputs.build_rule }}" ] && BR="--build-rule ${{ steps.cfg.outputs.build_rule }}"
          python -m phase2.make_split corpus/tasks.jsonl --repos "${{ steps.cfg.outputs.repos }}" --build "${{ steps.cfg.outputs.build }}" $BR --min-eval "${{ steps.cfg.outputs.min_eval }}" $CM --out corpus/split.json | tee "$D/split-decision.json"
          cp corpus/split.json "$D/split.json"; cp .exp-run.json "$D/config.json"
      - name: Common flags
        run: |
          P="--provider ${{ steps.cfg.outputs.provider }} --base-url ${{ steps.cfg.outputs.base_url }} --api-key-env MODEL_API_KEY --model ${{ steps.cfg.outputs.model }} --top-k ${{ steps.cfg.outputs.top_k }} --ttl ${{ steps.cfg.outputs.ttl }}"
          P="$P --similarity ${{ steps.cfg.outputs.similarity }} --embedding-model ${{ steps.cfg.outputs.embedding_model }} --theta ${{ steps.cfg.outputs.theta }} --rho ${{ steps.cfg.outputs.rho }} --cluster-similarity ${{ steps.cfg.outputs.cluster_similarity }} --consolidation ${{ steps.cfg.outputs.consolidation }} --min-occurrences ${{ steps.cfg.outputs.min_occurrences }} --min-distinct-inputs ${{ steps.cfg.outputs.min_distinct_inputs }} --granularity ${{ steps.cfg.outputs.granularity }} --tau ${{ steps.cfg.outputs.tau }}"
          [ -n "${{ steps.cfg.outputs.embedding_revision }}" ] && P="$P --embedding-revision ${{ steps.cfg.outputs.embedding_revision }}"
          [ -n "${{ steps.cfg.outputs.negative_control }}" ] && P="$P --negative-control ${{ steps.cfg.outputs.negative_control }}"
          echo "COMMON=$P" >> "$GITHUB_ENV"
          echo 'MX=${{ steps.cfg.outputs.model_extra }}' >> "$GITHUB_ENV"
      - name: Phase 3 — learn
        if: steps.cfg.outputs.stage == 'learn' || steps.cfg.outputs.stage == 'both'
        run: |
          set -euo pipefail
          test -n "$MODEL_API_KEY" || { echo "MODEL_API_KEY secret is not set"; exit 2; }
          python -m phase3.learn --tasks corpus/tasks.jsonl --models corpus/models.json --split corpus/split.json --repos-dir corpus/repos --out runs/learn $COMMON --model-extra "$MX"
          mkdir -p "${{ steps.cfg.outputs.dir }}/learn"
          for d in runs/learn/*/; do
            r=$(basename "$d"); cp "$d/gate3.json" "${{ steps.cfg.outputs.dir }}/learn/$r.gate3.json"; cp "$d/kernel.json" "${{ steps.cfg.outputs.dir }}/learn/$r.kernel.json"
            python -m phase3.diagnose "$d" --out "${{ steps.cfg.outputs.dir }}/learn/$r.diagnose.json" | head -40
          done
          # vectors are small for smoke runs; keep them with the results when the total is under 8 MB
          if [ "$(du -sm runs/learn | cut -f1)" -lt 8 ]; then for d in runs/learn/*/; do r=$(basename "$d"); [ -f "$d/embeddings.jsonl" ] && cp "$d/embeddings.jsonl" "${{ steps.cfg.outputs.dir }}/learn/$r.embeddings.jsonl"; done; fi; true
      - name: Reuse an earlier learn artifact
        if: steps.cfg.outputs.stage == 'evaluate'
        run: |
          set -euo pipefail
          N="${{ steps.cfg.outputs.learn_run }}"; test -n "$N" || { echo "learn_run is required for stage=evaluate"; exit 3; }
          RID=$(gh api "repos/${{ github.repository }}/actions/workflows/experiment.yml/runs?per_page=100" --jq ".workflow_runs[] | select(.run_number == $N) | .id" | head -1)
          gh run download "$RID" -n "learn-$N" -D runs/learn/
          gh run download "$RID" -n "eval-$N" -D runs/eval/ || echo "no eval artifact to reuse"
          ls runs/learn runs/eval 2>/dev/null | head -30
          echo "{\"resume_of\": $N}" > "${{ steps.cfg.outputs.dir }}/resume.json"
      - name: Phase 4 — evaluate
        if: steps.cfg.outputs.stage == 'evaluate' || steps.cfg.outputs.stage == 'both'
        run: |
          set -euo pipefail
          test -n "$MODEL_API_KEY" || { echo "MODEL_API_KEY secret is not set"; exit 2; }
          python -m phase4.evaluate --tasks corpus/tasks.jsonl --models corpus/models.json --split corpus/split.json --learn-dir runs/learn --repos-dir corpus/repos --out runs/eval --seed "${{ steps.cfg.outputs.seed }}" --max-eval-per-repo "${{ steps.cfg.outputs.max_eval_per_repo }}" --arms "${{ steps.cfg.outputs.arms }}" $COMMON --model-extra "$MX"
          mkdir -p "${{ steps.cfg.outputs.dir }}/eval"; cp runs/eval/gate4.json "${{ steps.cfg.outputs.dir }}/eval/gate4.json"
          for d in runs/eval/*/; do r=$(basename "$d"); [ -f "$d/arms.json" ] && cp "$d/arms.json" "${{ steps.cfg.outputs.dir }}/eval/$r.arms.json"; done; true
          NC=""; [ -n "${{ steps.cfg.outputs.negative_control }}" ] && NC="--negative-control ${{ steps.cfg.outputs.negative_control }}"
          python -m phase4.paired --tasks corpus/tasks.jsonl --eval-dir "${{ steps.cfg.outputs.dir }}/eval" $NC --secondary-repos "${{ steps.cfg.outputs.secondary_repos }}" --out "${{ steps.cfg.outputs.dir }}/paired"
      - name: Design A — rolling (prequential) evaluation
        if: steps.cfg.outputs.stage == 'rolling'
        run: |
          set -euo pipefail
          test -n "$MODEL_API_KEY" || { echo "MODEL_API_KEY secret is not set"; exit 2; }
          D="${{ steps.cfg.outputs.dir }}"; mkdir -p "$D/rolling"; cp .exp-run.json "$D/config.json"
          N="${{ steps.cfg.outputs.resume_run }}"
          if [ -n "$N" ]; then
            RID=$(gh api "repos/${{ github.repository }}/actions/workflows/experiment.yml/runs?per_page=100" --jq ".workflow_runs[] | select(.run_number == $N) | .id" | head -1)
            gh run download "$RID" -n "rolling-$N" -D runs/rolling/ && echo "{\"resume_of\": $N}" > "$D/resume.json" || echo "no rolling artifact to reuse"
          fi
          PP=""; [ -n "${{ steps.cfg.outputs.placebo_pool }}" ] && PP="--placebo-pool ${{ steps.cfg.outputs.placebo_pool }}" && cp "${{ steps.cfg.outputs.placebo_pool }}" "$D/placebo-pool.json"
          python -m phase4.rolling --tasks corpus/tasks.jsonl --models corpus/models.json --repos "${{ steps.cfg.outputs.repos }}" --warmup "${{ steps.cfg.outputs.warmup }}" --repos-dir corpus/repos \
            --out runs/rolling --seed "${{ steps.cfg.outputs.seed }}" --arms "${{ steps.cfg.outputs.arms }}" $PP $COMMON --model-extra "$MX"
          cp runs/rolling/gate4.json "$D/rolling/gate4.json"
          for d in runs/rolling/*/; do r=$(basename "$d"); for f in arms gate3; do [ -f "$d/$f.json" ] && cp "$d/$f.json" "$D/rolling/$r.$f.json"; done; done; true
          NC=""; [ -n "${{ steps.cfg.outputs.negative_control }}" ] && NC="--negative-control ${{ steps.cfg.outputs.negative_control }}"
          python -m phase4.paired --eval-dir "$D/rolling" $NC --secondary-repos "${{ steps.cfg.outputs.secondary_repos }}" --out "$D/paired"
          if [ "${{ steps.cfg.outputs.calibrate_tau }}" = "true" ] || [ "${{ steps.cfg.outputs.calibrate_tau }}" = "True" ]; then
            python -m phase2.calibrate_tau --rolling-dir "$D/rolling" --arm ungated --out "$D/tau.json"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.cfg.outputs.stage == 'rolling'
        with:
          name: rolling-${{ github.run_number }}
          path: runs/rolling/
          retention-days: 90
      - name: Build the placebo pool from an earlier rolling run's kernels (no model calls)
        if: steps.cfg.outputs.stage == 'placebo-pool'
        run: |
          set -euo pipefail
          N="${{ steps.cfg.outputs.pool_from_run }}"; test -n "$N" || { echo "pool_from_run is required"; exit 3; }
          RID=$(gh api "repos/${{ github.repository }}/actions/workflows/experiment.yml/runs?per_page=100" --jq ".workflow_runs[] | select(.run_number == $N) | .id" | head -1)
          gh run download "$RID" -n "rolling-$N" -D runs/pool/
          D="${{ steps.cfg.outputs.dir }}"; mkdir -p "$D"; cp .exp-run.json "$D/config.json"
          K=$(ls runs/pool/*/kernel.json | paste -sd, -)
          python -m phase4.placebo_pool --kernels "$K" --out "$D/placebo-pool.json"
      - name: Merge sharded rolling runs (no model calls)
        if: steps.cfg.outputs.stage == 'merge'
        run: |
          set -euo pipefail
          D="${{ steps.cfg.outputs.dir }}"; mkdir -p "$D"; cp .exp-run.json "$D/config.json"
          DIRS=$(echo "${{ steps.cfg.outputs.merge_runs }}" | tr ',' '\n' | sed 's#^#results/experiment/#; s#$#/rolling#' | paste -sd, -)
          CFGS=$(echo "${{ steps.cfg.outputs.merge_runs }}" | tr ',' '\n' | sed 's#^#results/experiment/#; s#$#/config.json#' | paste -sd' ' -)
          python -m phase2.check_config docs/exp-run.v2.json $CFGS | tee "$D/config-check.txt"
          NC=""; [ -n "${{ steps.cfg.outputs.negative_control }}" ] && NC="--negative-control ${{ steps.cfg.outputs.negative_control }}"
          python -m phase4.aggregate --dirs "$DIRS" $NC --out "$D/rolling"
          python -m phase4.paired --eval-dir "$D/rolling" $NC --secondary-repos "${{ steps.cfg.outputs.secondary_repos }}" --out "$D/paired"
      - name: Paired analysis of an earlier evaluation (no model calls)
        if: steps.cfg.outputs.stage == 'analyze'
        run: |
          set -euo pipefail
          N="${{ steps.cfg.outputs.eval_run }}"; test -n "$N" || { echo "eval_run is required for stage=analyze"; exit 3; }
          D="${{ steps.cfg.outputs.dir }}"; mkdir -p "$D"; cp .exp-run.json "$D/config.json"; echo "{\"analysis_of\": $N}" > "$D/resume.json"
          NC=""; [ -n "${{ steps.cfg.outputs.negative_control }}" ] && NC="--negative-control ${{ steps.cfg.outputs.negative_control }}"
          python -m phase4.paired --tasks corpus/tasks.jsonl --eval-dir "results/experiment/$N/eval" $NC --secondary-repos "${{ steps.cfg.outputs.secondary_repos }}" --out "$D/paired"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learn-${{ github.run_number }}
          path: runs/learn/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ github.run_number }}
          path: runs/eval/
          retention-days: 90
      - name: Commit results
        if: always()
        run: |
          set -euo pipefail
          git config user.name "experiment-bot"; git config user.email "experiment-bot@users.noreply.github.com"
          git add results/
          git commit -m "results(experiment): run ${{ github.run_number }} [skip ci]" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
